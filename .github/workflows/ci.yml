name: CI

on:
  push:
  pull_request:
  schedule:
    # Longer fuzz smoke on a quiet weekday morning (UTC).
    - cron: "17 5 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs; keep pushes to main so rapid commits do not
  # abort a useful gate.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  test:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  # Pin: https://github.com/EmbarkStudios/cargo-deny-action/releases/tag/v2.1.1
  # (README: https://github.com/EmbarkStudios/cargo-deny-action#usage)
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check
          arguments: --locked

  coverage:
    name: coverage (≥ 80 % lines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # SPEC.md: ≥ 80 % lines for proto, resolver, filtering, policy.
      - name: Coverage with fail-under
        run: >
          cargo llvm-cov
          -p dnscraft-proto
          -p dnscraft-resolver
          -p dnscraft-filtering
          -p dnscraft-policy
          --locked
          --fail-under-lines 80
          --summary-only

  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - name_decode
          - message_decode
          - message_roundtrip
          - rule_parse
          - listeners_handle_wire
          - listeners_doh_request
    # Root rust-toolchain.toml pins stable; cargo-fuzz needs nightly (-Zsanitizer).
    # RUSTUP_TOOLCHAIN overrides that pin for this job only.
    # Use the gnu target: musl defaults to crt-static, which is incompatible with ASAN.
    env:
      RUSTUP_TOOLCHAIN: nightly
      # PRs/pushes: 60 s smoke. Monday schedule: 10 min (acceptance-style).
      FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '600' || '60' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
          prefix-key: fuzz-${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Fuzz ${{ matrix.target }} (${{ env.FUZZ_SECONDS }}s)
        working-directory: fuzz
        run: >
          cargo fuzz run ${{ matrix.target }}
          --target x86_64-unknown-linux-gnu
          -- -max_total_time=${{ env.FUZZ_SECONDS }}
