[package]
name = "dnscraft-proto-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
dnscraft-proto = { path = "../crates/dnscraft-proto" }
dnscraft-filtering = { path = "../crates/dnscraft-filtering" }
dnscraft-policy = { path = "../crates/dnscraft-policy" }
dnscraft-listeners = { path = "../crates/dnscraft-listeners" }
http = "1.5.0"
tokio = { version = "1.54.1", features = ["rt"] }

[[bin]]
name = "name_decode"
path = "fuzz_targets/name_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "message_decode"
path = "fuzz_targets/message_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "message_roundtrip"
path = "fuzz_targets/message_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rule_parse"
path = "fuzz_targets/rule_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "listeners_handle_wire"
path = "fuzz_targets/listeners_handle_wire.rs"
test = false
doc = false
bench = false

[[bin]]
name = "listeners_doh_request"
path = "fuzz_targets/listeners_doh_request.rs"
test = false
doc = false
bench = false

[workspace]
