[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/xeonixo/dnscraft"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

# Shared dependency versions. Dependencies are added per task.
[workspace.dependencies]
tokio = { version = "1.54", features = ["net", "rt", "macros", "time", "io-util", "sync"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "gzip"] }
hickory-proto = { version = "=0.26.3", default-features = false, features = ["std"] }
thiserror = "2.0"
idna = "1.1"
ring = "0.17"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
proptest = "1"
rand = "0.9"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
ipnet = "2"
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }
time = { version = "0.3.55", default-features = false, features = ["parsing", "std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
x509-parser = "0.18"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
instant-acme = { version = "0.8.5", default-features = false, features = ["ring", "rcgen", "time", "x509-parser"] }
async-trait = "0.1"
http = "1"
bytes = "1"
http-body-util = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
