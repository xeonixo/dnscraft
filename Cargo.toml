[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/xeonixo/dnscraft"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

# Shared dependency versions. Dependencies are added per task.
[workspace.dependencies]
tokio = { version = "1.54.1", features = ["net", "rt", "macros", "time", "io-util", "sync"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "gzip"] }
webpki-roots = "1.0.11"
hickory-proto = { version = "=0.26.3", default-features = false, features = ["std"] }
thiserror = "2.0.21"
idna = "1.1.0"
ring = "0.17.14"
tracing = "0.1.44"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
proptest = "1.12.0"
rand = "0.10.3"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
ipnet = "2.12.2"
zeroize = { version = "1.9.1", default-features = false, features = ["alloc"] }
time = { version = "0.3.55", default-features = false, features = ["parsing", "std"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem", "x509-parser"] }
x509-parser = "0.18.1"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
instant-acme = { version = "0.8.5", default-features = false, features = ["ring", "rcgen", "time", "x509-parser"] }
async-trait = "0.1.92"
http = "1.5.0"
bytes = "1.12.1"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", default-features = false, features = ["server", "http1", "http2", "client"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio", "server-auto", "server", "client", "client-legacy", "http1", "http2", "service"] }
base64 = "0.23.1"
socket2 = "0.6.5"
quinn-udp = "=0.5.16"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
rusqlite = { version = "0.40.0", features = ["bundled"] }
axum = { version = "0.8.9", default-features = false, features = ["json", "query", "http1", "tokio", "tracing"] }
tower-http = { version = "0.6.11", default-features = false, features = ["trace"] }
argon2 = "0.6.0"
openidconnect = { version = "4.0.1", default-features = false }
chrono = { version = "0.4.35", default-features = false, features = ["std"] }
url = "2.5.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
