[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/xeonixo/dnscraft"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

# Shared dependency versions. Dependencies are added per task.
[workspace.dependencies]
tokio = { version = "1.54", features = ["net", "rt", "macros", "time", "io-util", "sync"] }
hickory-proto = { version = "=0.26.3", default-features = false, features = ["std"] }
thiserror = "2.0"
ring = "0.17"
tracing = "0.1"
proptest = "1"
rand = "0.9"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
