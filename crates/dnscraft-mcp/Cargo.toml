[package]
name = "dnscraft-mcp"
version = "0.1.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Stateless MCP 2026-07-28 server (tools only) for DNScraft"

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
axum = { workspace = true }
bytes = { workspace = true }
dnscraft-common = { path = "../dnscraft-common" }
http = { workspace = true }
http-body-util = { workspace = true }
idna = { workspace = true }
rmcp = { version = "=3.7.0", default-features = false, features = ["server", "transport-streamable-http-server", "macros"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
