[package]
name = "dnscraft-listeners"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "DNS listeners (Do53, DoT, DoH, DoQ) for DNScraft"

[lints]
workspace = true

[dependencies]
dnscraft-policy = { path = "../dnscraft-policy" }
thiserror = { workspace = true }
tokio = { workspace = true }
socket2 = { workspace = true }

[dev-dependencies]
dnscraft-filtering = { path = "../dnscraft-filtering" }
dnscraft-proto = { path = "../dnscraft-proto" }
dnscraft-resolver = { path = "../dnscraft-resolver" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time"] }
