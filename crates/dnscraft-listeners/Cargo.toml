[package]
name = "dnscraft-listeners"
version = "0.1.3"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "DNS listeners (Do53, DoT, DoH, DoQ) for DNScraft"

[lints]
workspace = true

[dependencies]
dnscraft-common = { path = "../dnscraft-common" }
dnscraft-policy = { path = "../dnscraft-policy" }
dnscraft-proto = { path = "../dnscraft-proto" }
dnscraft-resolver = { path = "../dnscraft-resolver" }
dnscraft-filtering = { path = "../dnscraft-filtering" }
dnscraft-tls = { path = "../dnscraft-tls" }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true, features = ["derive", "rc"] }
tokio = { workspace = true, features = ["signal"] }
socket2 = { workspace = true }
quinn-udp = { workspace = true }
quinn = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
base64 = { workspace = true }
h3 = { workspace = true }
h3-quinn = { workspace = true }

[dev-dependencies]
dnscraft-testkit = { path = "../dnscraft-testkit" }
serde_json = { workspace = true }
hickory-proto = { workspace = true }
proptest = { workspace = true }
rcgen = { workspace = true }
rustls-pki-types = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "test-util"] }
http-body-util = { workspace = true }
criterion = { workspace = true }

[[example]]
name = "serve"
required-features = []

[[bench]]
name = "udp"
harness = false
