[package]
name = "dnscraft-filtering"
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
idna = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true }
dnscraft-common = { path = "../dnscraft-common" }
tokio = { workspace = true }
reqwest = { workspace = true }
regex = "1.13.1"
rustls = { workspace = true }
webpki-roots = { workspace = true }

[features]
# Bench-only synthetic reference rule set (`src/testgen.rs`). Not a public API.
testgen = []

[dev-dependencies]
criterion = { workspace = true }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
proptest = { workspace = true }
rcgen = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
webpki-roots = { workspace = true }

[[bench]]
name = "matching"
harness = false
required-features = ["testgen"]
