[package]
name = "dnscraft-tls"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "ACME DNS-01 certificates, CertResolver, and DynDNS for DNScraft"

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
tokio = { workspace = true }
idna = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
webpki-roots = { workspace = true }
x509-parser = { workspace = true }
reqwest = { workspace = true }
instant-acme = { workspace = true }
async-trait = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
http-body-util = { workspace = true }
dnscraft-proto = { path = "../dnscraft-proto" }
rand = { workspace = true }
rcgen = { workspace = true }
zeroize = { workspace = true }
# `macros` for a compile-time IMF-fixdate format (Retry-After); not Rfc2822.
time = { workspace = true, features = ["macros"] }

[dev-dependencies]
proptest = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
x509-parser = { workspace = true }
