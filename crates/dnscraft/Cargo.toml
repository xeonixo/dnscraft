[package]
name = "dnscraft"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "DNScraft DNS server (minimal binary bootstrap)"

[lints]
workspace = true

[dependencies]
dnscraft-api = { path = "../dnscraft-api" }
dnscraft-clients = { path = "../dnscraft-clients" }
dnscraft-listeners = { path = "../dnscraft-listeners" }
dnscraft-policy = { path = "../dnscraft-policy" }
dnscraft-resolver = { path = "../dnscraft-resolver" }
dnscraft-filtering = { path = "../dnscraft-filtering" }
dnscraft-tls = { path = "../dnscraft-tls" }
tokio = { workspace = true, features = ["rt-multi-thread", "signal"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "env-filter"] }

[dev-dependencies]
dnscraft-proto = { path = "../dnscraft-proto" }
