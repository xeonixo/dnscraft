[package]
name = "dnscraft-api"
version = "0.1.3"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Control API (config, query log, stats, audit, auth) for DNScraft"

[features]
web-ui = ["dep:rust-embed"]

[lints]
workspace = true

[dependencies]
argon2 = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
dnscraft-cluster = { path = "../dnscraft-cluster" }
dnscraft-common = { path = "../dnscraft-common" }
dnscraft-filtering = { path = "../dnscraft-filtering" }
dnscraft-listeners = { path = "../dnscraft-listeners" }
dnscraft-mcp = { path = "../dnscraft-mcp" }
dnscraft-policy = { path = "../dnscraft-policy" }
dnscraft-proto = { path = "../dnscraft-proto" }
dnscraft-resolver = { path = "../dnscraft-resolver" }
dnscraft-tls = { path = "../dnscraft-tls" }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
openidconnect = { workspace = true }
rcgen = { workspace = true }
reqwest = { workspace = true }
ring = { workspace = true }
rusqlite = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true, features = ["formatting", "macros"] }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
tower = { version = "0.5", default-features = false, features = ["util"] }
url = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
webpki-roots = { workspace = true }
zeroize = { workspace = true }
rust-embed = { version = "8.7.0", optional = true }

[dev-dependencies]
dnscraft-testkit = { path = "../dnscraft-testkit" }

[[test]]
name = "web_ui_embed"
required-features = ["web-ui"]
