[package]
name = "dnscraft-policy"
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
dnscraft-common = { path = "../dnscraft-common" }
dnscraft-proto = { path = "../dnscraft-proto" }
dnscraft-resolver = { path = "../dnscraft-resolver" }
dnscraft-filtering = { path = "../dnscraft-filtering" }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true, features = ["derive", "rc"] }
ipnet = { workspace = true, features = ["serde"] }

[dev-dependencies]
criterion = { workspace = true }
dnscraft-testkit = { path = "../dnscraft-testkit" }
hickory-proto = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }

[[bench]]
name = "pipeline"
harness = false
