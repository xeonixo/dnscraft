# Single-node smoke stack for the dnscraft binary (example.com / RFC 5737 only).
#
#   docker compose up --build
#   dig @127.0.0.1 -p 5300 example.com A +short
#   curl -fsS http://127.0.0.1:8080/healthz

services:
  dnscraft:
    build:
      context: .
      dockerfile: Dockerfile
    image: dnscraft:local
    ports:
      - "5300:5300/udp"
      - "5300:5300/tcp"
      - "8080:8080/tcp"
    volumes:
      - dnscraft-data:/var/lib/dnscraft
      - ./deploy/dnscraft.docker.toml:/etc/dnscraft/config.toml:ro
    environment:
      RUST_LOG: info
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 45s
    restart: unless-stopped

volumes:
  dnscraft-data:
