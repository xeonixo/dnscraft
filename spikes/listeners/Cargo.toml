[package]
name = "spike-listeners"
version = "0.0.0"
edition = "2024"
publish = false

# Throwaway spike (Task N0): deliberately NOT part of the root workspace.
[workspace]

[dependencies]
# Approved plan versions (verify in N0 findings).
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
quinn-udp = "0.6.3"
h3 = "0.0.8"
h3-quinn = "0.0.10"
hyper = { version = "1.12", features = ["server", "http1", "http2", "client"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server-auto", "server-graceful", "client-legacy", "http1", "http2"] }
http = "1.5"
http-body-util = "0.1"
bytes = "1.12"
tokio = { version = "1.54", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1.15"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
futures = "0.3"

[[bin]]
name = "spike-listeners"
path = "src/main.rs"
